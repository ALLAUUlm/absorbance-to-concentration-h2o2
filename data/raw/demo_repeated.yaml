# Intended for development purposes
# Template for a measurement that was repeated by taking a further amount
# of the original sample and diluting it again (e.g. because the first
# reading was too noisy or the signal was oversaturated). The resulting
# file should be named like the original measurement but with the
# repetition number's letter suffix appended (e.g. "..._1a.csv"/".yaml"
# for a repeat of measurement "..._1").
date: "2025-01-30"
start time: "10:42:00"
irradiation:
  time:
    unit: h
    value: 1.0
spot: 1 # see wiki http://
extraction:
  - repetition: 0
    sample extracted:
      unit: mL
      value: 0.5
      phase: aqueous
    complexing agent:
      name: TiOSO4
      added:
        unit: mL
        value: 0.5
    sample dilution:
      name: H2O
      added:
        unit: mL
        value: 2.0
  - repetition: 1
    reason: noise #copy one of the following "noise" or "oversaturated"
    sample extracted:
      unit: mL
      value: 1.0
      phase: aqueous
    sample dilution:
      name: H2O
      added:
        unit: mL
        value: 2.0

system: # batch properties
  phases: [aqueous] # a list of phases apparent in the system, e.g. aqueous, octanol, etc.
  purging:
    time:
      value: 3
      unit: min
    gas: O2
  type: photochemical
  batch: LN550023
  material:
    name: LN55
    synthesis date: '2023-02-xx'
    mass:
      unit: mg
      value: 15.003
  wavelength:
        unit: nm
        value: 406
  reactor:
    volume: 88 #write total volume big ~ 88 mL, small ~ 32 mL total volume - TODO number reactors with unique identifier and upload pics on wiki
    unit: mL
    form: cylindric
  Loading:
    unit: g/L
    value: 0.75
  donor:
    name: EtOH
    value: 18
    unit: mL
  solvent:
    name: H2O
    value: 2
    unit: mL
  sonication:  # if not, do not provide a value for time
    time:
      value:
      unit: min
  incident light intensity:
    value: 50
    unit: mW cm-2
  thermostat: #if not, do not provide value for temperature - TODO - make unique identifiers for the two different thermostats in the lab
    temperature:
      value: 22.0
      unit: deg_C

curation:
  process:
  - role: experimentalist
    name: Alexander Lange
    orcid: https://orcid.org/0009-0005-7474-7160
  - role: supervisor
    name: Radim Beranek
    orcid:
eln:
  url: XXX # URL to the ELN describing the data

echemdb loader: UVV # The name of a loader which can be used to load and convert data

experimental:
  tags:
  - UVV
  url: # For example: doi referring to a published work

  instrumentation:
  - type: LED-platform, ThorLED
    manufacturer: XXX, ThorLabs
    name: LEDp365, Thor365    # a unique name of the device

  description: some description # A string or a new set of metadata

projects: # Descriptor of projects linked to the data.

- name: catalightB10
  type: internal
  url:   # link to the description of the project

- name: SFB XXX
  type: external
  url:   # project homepage

  grant number: XXX   # In case of numbers, add as string such as `00231`

figure description:
  fields:
  - name: lambda
    unit: nm
    description: Excitation wavelength.
    dimension: Lambda
  - name: abs
    unit: a.u.
    description: Absorbance at respective wavelength
